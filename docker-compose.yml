version: "3.8"

# Database settings shared by the migration job and the API server
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASS: ${DB_PASS:-password}
  DB_NAME: jari
  DB_SSLMODE: disable

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jari-postgres
    environment:
      POSTGRES_DB: jari
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jari"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jari-network

  # Redis: background job queue (asynq), see docs/adr/0004-job-latar-dan-queue.md
  redis:
    image: redis:7-alpine
    container_name: jari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jari-network

  # One-shot job: apply the migrations embedded in the binary, then exit
  migrate:
    build: .
    image: jari-app
    command: ["./main", "migrate", "up"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - jari-network

  # Application (refuses to start if the schema is not fully migrated)
  app:
    build: .
    image: jari-app
    container_name: jari-app
    ports:
      - "8080:8080"
    environment:
      <<: *db-env
      SERVER_PORT: "8080"
      SERVER_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (openssl rand -hex 32)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Readiness: 200 only while the DB answers and the schema is fully migrated
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:$${SERVER_PORT}/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jari-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  jari-network:
    driver: bridge
